server:
  port: 8081
  
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/telecom_campaign_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework: INFO

